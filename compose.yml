# GM-3D Chess on Docker Compose — three services, one shared image:
#   web    Next.js standalone app (UI + 3D), internal port 3000
#   chess  Socket.IO service (rooms, server-side validation), internal port 3003
#   proxy  nginx, publishes ${APP_PORT:-80} and routes by the
#          ?XTransformPort=3003 query marker (same-origin, no CORS)
#
#   docker compose up --build -d      # build & start
#   open http://localhost:80          # or http://localhost:${APP_PORT}
#
# Rooms are in memory: exactly one chess instance, `down` clears them.

name: gm3d-chess

services:
  chess:
    build: .
    image: gm3d-chess:latest
    command: ["bun", "index.ts"]
    working_dir: /service
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://127.0.0.1:3003/?EIO=4&transport=polling'); if (!r.ok) process.exit(1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    image: gm3d-chess:latest
    command: ["bun", "server.js"]
    working_dir: /app
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    depends_on:
      chess:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://127.0.0.1:3000/'); if (!r.ok) process.exit(1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  proxy:
    image: nginx:alpine
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./nginx/chess.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy
      chess:
        condition: service_healthy
    restart: unless-stopped
