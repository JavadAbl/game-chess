# GM-3D Chess — same-origin gateway for Docker Compose.
#
# The browser client (src/lib/net/socket.ts) always connects to its own
# origin, appending the marker `XTransformPort=3003` to the query string.
# Requests carrying that marker go to the Socket.IO service; everything
# else goes to the Next.js app. Same domain, no CORS, no hardcoded ports.

upstream chess_service {
    server chess:3003;
}

upstream web_app {
    server web:3000;
}

# WebSocket upgrade header
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Switch upstream on the query-string marker
map $args $backend {
    ~XTransformPort=3003 chess_service;
    default              web_app;
}

server {
    listen 80;

    location / {
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # > Socket.IO pingTimeout (60 s) so idle games survive
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
